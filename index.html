function curvedSegment(s,e,b,steps=36){const lat1=s.lat,lng1=s.lng,lat2=e.lat,lng2=e.lng,midLat=(lat1+lat2)/2,midLng=(lng1+lng2)/2,dx=lng2-lng1,dy=lat2-lat1,dist=Math.sqrt(dx*dx+dy*dy),safe=b*Math.min(dist,1.4),ctrlLat=midLat-dx*safe,ctrlLng=midLng+dy*safe,out=[];for(let i=0;i<=steps;i++){const t=i/steps,a=(1-t)*(1-t),bb=2*(1-t)*t,c=t*t;out.push([a*lat1+bb*ctrlLat+c*lat2,a*lng1+bb*ctrlLng+c*lng2]);}return out;}

function listHtml(items){return items&&items.length?`<ul class="mini-list">${items.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>`:""}
function lockChipWidths(){details.querySelectorAll(".chip").forEach(btn=>{if(btn.dataset.lockedWidth)return;const w=Math.ceil(btn.getBoundingClientRect().width);if(w>0){btn.style.width=w+"px";btn.dataset.lockedWidth="1";}})}
function renderDetails(d){const timeline=d.schedule.map(i=>`<div class="slot"><div class="slot-time">${escapeHtml(i.time)}</div><div class="slot-main"><div class="slot-title">${escapeHtml(i.title)}</div><div class="slot-place">${escapeHtml(i.place)}</div><div class="slot-note">${escapeHtml(i.note)}</div></div></div>`).join("");details.innerHTML=`<div class="info-section"><h3>Laika plāns</h3>${timeline}</div><div class="info-section"><h3>Google Maps meklējumi</h3>${chipsHtml(d.mapSearch,"📍")||"<div class='slot-note'>Nav.</div>"}</div><div class="info-section"><h3>Bildēm / priekšskatam</h3>${chipsHtml(d.imageSearch,"🖼️")||"<div class='slot-note'>Nav.</div>"}</div><div class="info-section"><h3>Apstiprināt / izdarīt</h3>${listHtml(d.confirm)||"<div class='slot-note'>Nav.</div>"}</div><div class="info-section"><h3>Rezerves variants / ko izlaist</h3>${listHtml(d.backup)||"<div class='slot-note'>Nav.</div>"}</div>`;details.querySelectorAll("[data-copy]").forEach(btn=>btn.addEventListener("click",async()=>{lockChipWidths();const text=btn.dataset.copy;const old=btn.textContent;try{await navigator.clipboard.writeText(text);btn.classList.add("copied");btn.textContent="✅ Nokopēts";setTimeout(()=>{btn.textContent=old;btn.classList.remove("copied")},900)}catch{btn.textContent=text}}));details.classList.remove("open");scheduleToggle.textContent="Rādīt pilno dienas plānu";cardBody.scrollTop=0;}
function toggleDetails(e){stop(e);const open=details.classList.toggle("open");scheduleToggle.textContent=open?"Paslēpt pilno dienas plānu":"Rādīt pilno dienas plānu";if(open)setTimeout(()=>{lockChipWidths();scheduleToggle.scrollIntoView({behavior:"smooth",block:"start"})},50)}
function selectDay(dayId,zoom){const d=days.find(x=>x.id===dayId);if(!d)return;hideHint();checkPanel.classList.remove("open");drawer.classList.remove("open");menuBtn.style.display="block";checklistBtn.style.display="block";setRoutesActive(dayId);document.getElementById("cardTop").style.background=d.color;document.getElementById("cardDate").textContent=d.date+" · "+d.theme;document.getElementById("cardTitle").textContent=`${d.emoji} ${d.title}`;document.getElementById("cardSummary").textContent=d.summary;document.getElementById("cardDrive").textContent=d.drive;document.getElementById("cardEffort").textContent=d.effort;document.getElementById("cardRoute").textContent=d.points.join(" → ");renderDetails(d);card.classList.add("show");if(zoom)map.fitBounds(routeBounds.get(dayId),{padding:[65,65],maxZoom:d.points.length===1?11:10})}
function addMarkers(){const h=places["Viesnīca OAZ / Golema"];L.circleMarker([h.lat,h.lon],{radius:9,color:"#111827",fillColor:"#111827",weight:3,fillOpacity:1}).addTo(map).on("click",()=>map.setView([h.lat,h.lon],12));window.hotelLabel=L.marker([41.2510,19.4740],{icon:L.divIcon({className:"hotel-label",html:"🏨 Viesnīca OAZ",iconSize:null})}).addTo(map).on("click",()=>map.setView([h.lat,h.lon],12));Object.entries(places).forEach(([n,p])=>{if(n==="Viesnīca OAZ / Golema")return;const air=n.includes("lidosta");L.circleMarker([p.lat,p.lon],{radius:air?7:5,color:air?"#ec4899":"#334155",fillColor:"#ffffff",weight:air?3:2,fillOpacity:.95}).addTo(map).on("click",()=>map.setView([p.lat,p.lon],10));})}
function addRoutes(){days.forEach(d=>{routeBounds.set(d.id,focusBounds(d));const drawPoints=(d.draw&&d.draw.length)?d.draw:d.points;if(drawPoints.length<2)return;const latlngs=curvedRoute(drawPoints,d.bend);const outline=L.polyline(latlngs,{color:"#fff",weight:d.weight+5,opacity:.96,lineCap:"round",lineJoin:"round",interactive:false}).addTo(map);const line=L.polyline(latlngs,{color:d.color,weight:d.weight,opacity:.98,dashArray:d.dash||null,lineCap:"round",lineJoin:"round",interactive:false}).addTo(map);const hit=L.polyline(latlngs,{color:d.color,weight:42,opacity:.001,lineCap:"round",lineJoin:"round",className:"tap-line"}).addTo(map);hit.on("click",()=>selectDay(d.id,true));hit.on("touchstart",()=>selectDay(d.id,true));hit.on("pointerup",()=>selectDay(d.id,true));dayLayers.set(d.id,{outline,line,hit,baseWeight:d.weight});})}
function updateHotelLabelVisibility(){/* Hotel label intentionally always visible. */}
function addDayButtons(){const list=document.getElementById("dayList");days.forEach(d=>{const btn=document.createElement("button");btn.className="day";btn.innerHTML=`<span class="stripe" style="background:${d.color}"></span><span><span class="date">${escapeHtml(d.date)}</span><span class="name">${d.emoji} ${escapeHtml(d.title)}</span><span class="theme">${escapeHtml(d.theme)}</span></span><span class="arrow">›</span>`;btn.addEventListener("click",e=>{stop(e);selectDay(d.id,true)});list.appendChild(btn);dayButtons.set(d.id,btn);})}
function loadChecks(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{return {}}}
function saveChecks(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}
function updateProgress(){const boxes=[...document.querySelectorAll(".check-row input")],checked=boxes.filter(b=>b.checked).length,total=boxes.length,percent=total?Math.round(checked/total*100):0;document.getElementById("progressBar").style.width=percent+"%";document.getElementById("progressText").textContent=`${checked} / ${total} gatavs (${percent}%)`;boxes.forEach(b=>b.closest(".check-row").classList.toggle("done",b.checked));}
function renderChecklist(){const state=loadChecks(),content=document.getElementById("checkContent");content.innerHTML=checklists.map(sec=>{const rows=sec.items.map(item=>{const key=itemKey(sec.title,item),checked=state[key]?"checked":"";return `<label class="check-row"><input type="checkbox" data-check-key="${escapeHtml(key)}" ${checked}><span>${escapeHtml(item)}</span></label>`}).join("");return `<section class="check-section"><h3>${escapeHtml(sec.title)}</h3>${rows}</section>`}).join("");content.querySelectorAll("input[type='checkbox']").forEach(box=>box.addEventListener("change",()=>{const s=loadChecks();s[box.dataset.checkKey]=box.checked;saveChecks(s);updateProgress();}));updateProgress();}
function openChecklist(e){stop(e);hideHint();drawer.classList.remove("open");card.classList.remove("show");checkPanel.classList.add("open");menuBtn.style.display="none";checklistBtn.style.display="none";renderChecklist();}
function closeChecklist(e){stop(e);checkPanel.classList.remove("open");menuBtn.style.display="block";checklistBtn.style.display="block";}
function resetChecks(e){stop(e);if(!confirm("Notīrīt visas checklist atzīmes šajā telefonā?"))return;localStorage.removeItem(STORAGE_KEY);renderChecklist();}
menuBtn.addEventListener("click",openDrawer);checklistBtn.addEventListener("click",openChecklist);document.getElementById("drawerClose").addEventListener("click",closeDrawer);document.getElementById("cardClose").addEventListener("click",closeCard);document.getElementById("checkClose").addEventListener("click",closeChecklist);document.getElementById("resetChecks").addEventListener("click",resetChecks);scheduleToggle.addEventListener("click",toggleDetails);map.on("zoomend",updateHotelLabelVisibility);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){drawer.classList.remove("open");card.classList.remove("show");checkPanel.classList.remove("open");menuBtn.style.display="block";checklistBtn.style.display="block";setRoutesActive(null);}});
addMarkers();addRoutes();addDayButtons();renderChecklist();map.fitBounds(allBounds(),{padding:[45,45]});drawer.classList.add("open");menuBtn.style.display="none";checklistBtn.style.display="none";setTimeout(()=>map.invalidateSize(true),250);setTimeout(()=>map.invalidateSize(true),1000);
console.log("Albānijas karte OK",{dienas:days.length,vietas:Object.keys(places).length,laikaPlanaIeraksti:days.reduce((s,d)=>s+d.schedule.length,0),checklistItems:checklists.reduce((s,x)=>s+x.items.length,0),source:"FINAL Plan - Use This",tuesday:"Zvërnec + clear-water snorkel coast day",routeFanSpacing:true,hotelLabelAlwaysVisible:true});
</script></body></html>
