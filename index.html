<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <title>Albānijas ceļojuma karte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    .leaflet-container{overflow:hidden;position:relative;outline-style:none;background:#ddd;font:12px/1.5 Arial,sans-serif}
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
    .leaflet-map-pane,.leaflet-marker-pane,.leaflet-shadow-pane,.leaflet-tile-pane,.leaflet-overlay-pane,.leaflet-popup-pane,.leaflet-tooltip-pane{position:absolute;left:0;top:0}
    .leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}
    .leaflet-tile-loaded{visibility:inherit}
    .leaflet-tile-pane{z-index:200} .leaflet-overlay-pane{z-index:400} .leaflet-shadow-pane{z-index:500} .leaflet-marker-pane{z-index:600} .leaflet-tooltip-pane{z-index:650} .leaflet-popup-pane{z-index:700}
    .leaflet-control{position:relative;z-index:800;pointer-events:auto} .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none} .leaflet-top{top:0} .leaflet-right{right:0} .leaflet-bottom{bottom:0} .leaflet-left{left:0}
    .leaflet-control-zoom{margin-left:12px;margin-top:12px;border:2px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;overflow:hidden}
    .leaflet-control-zoom a{display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;color:#000;background:#fff;border-bottom:1px solid #ccc;font:bold 20px Arial}
    .leaflet-control-zoom a:last-child{border-bottom:none}
    .leaflet-tooltip{position:absolute;padding:6px;background:#fff;border:1px solid #fff;border-radius:4px;color:#222;white-space:nowrap;user-select:none;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.35)}

    *{box-sizing:border-box}
    html,body,#map{height:100%;height:100dvh;width:100%;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7}
    #map{z-index:1}

    :root{
      --dark:rgba(17,24,39,.95);
      --soft:rgba(255,255,255,.16);
      --shadow:0 12px 32px rgba(0,0,0,.28);
    }

    .menu-btn{
      position:fixed;
      left:14px;
      bottom:calc(14px + env(safe-area-inset-bottom));
      z-index:1400;
      border:0;
      border-radius:999px;
      background:var(--dark);
      color:white;
      box-shadow:var(--shadow);
      padding:12px 16px;
      font-weight:800;
      font-size:15px;
      min-height:48px;
      cursor:pointer;
      display:none;
    }

    .hint{
      position:fixed;
      left:14px;
      right:14px;
      top:calc(14px + env(safe-area-inset-top));
      z-index:1350;
      background:rgba(255,255,255,.96);
      color:#111827;
      border-radius:14px;
      padding:10px 42px 10px 12px;
      box-shadow:var(--shadow);
      font-size:14px;
      line-height:1.3;
      max-width:560px;
    }
    .hint button{
      position:absolute;
      right:6px;
      top:6px;
      border:0;
      background:#e5e7eb;
      border-radius:999px;
      width:30px;
      height:30px;
      font-size:20px;
      line-height:1;
      cursor:pointer;
    }

    .drawer{
      position:fixed;
      left:10px;
      right:10px;
      bottom:calc(10px + env(safe-area-inset-bottom));
      z-index:1500;
      background:var(--dark);
      color:white;
      border-radius:18px;
      box-shadow:var(--shadow);
      max-height:min(78dvh,680px);
      transform:translateY(calc(100% + 24px));
      transition:transform .22s ease;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .drawer.open{transform:translateY(0)}

    .drawer-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 16px 10px;
      border-bottom:1px solid var(--soft);
    }
    .drawer-title{font-weight:900;font-size:17px}
    .drawer-sub{color:#cbd5e1;font-size:13px;margin-top:3px;line-height:1.3}
    .close{
      border:0;
      background:rgba(255,255,255,.16);
      color:white;
      width:38px;
      height:38px;
      border-radius:999px;
      font-size:24px;
      line-height:1;
      cursor:pointer;
      flex:0 0 auto;
    }

    .day-list{overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
    .day{
      width:100%;
      display:grid;
      grid-template-columns:10px 1fr auto;
      gap:10px;
      align-items:center;
      color:white;
      background:rgba(255,255,255,.07);
      border:1px solid var(--soft);
      border-radius:14px;
      padding:10px;
      margin-bottom:8px;
      text-align:left;
      cursor:pointer;
      min-height:56px;
    }
    .day.active{background:rgba(255,255,255,.20);border-color:rgba(255,255,255,.65)}
    .stripe{width:10px;height:40px;border-radius:999px}
    .date{display:block;font-size:12px;color:#cbd5e1;font-weight:800;margin-bottom:2px}
    .name{display:block;font-size:15px;font-weight:900;line-height:1.2}
    .arrow{font-size:22px;color:#cbd5e1;font-weight:900}

    .card{
      position:fixed;
      left:10px;
      right:10px;
      bottom:calc(74px + env(safe-area-inset-bottom));
      z-index:1450;
      background:white;
      color:#111827;
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:none;
      max-height:42dvh;
    }
    .card.show{display:block}
    .card-top{color:white;padding:12px 52px 12px 14px;position:relative}
    .card-date{font-size:13px;font-weight:900;opacity:.93;margin-bottom:2px}
    .card-title{font-size:18px;font-weight:900;line-height:1.2}
    .card-close{
      position:absolute;
      right:8px;
      top:8px;
      border:0;
      background:rgba(255,255,255,.24);
      color:white;
      width:38px;
      height:38px;
      border-radius:999px;
      font-size:24px;
      line-height:1;
      cursor:pointer;
    }
    .card-body{padding:12px 14px 14px;font-size:14px;line-height:1.35;overflow:auto;max-height:calc(42dvh - 70px)}
    .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
    .fact{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:8px 10px;font-size:13px}
    .fact b{display:block;color:#64748b;text-transform:uppercase;font-size:11px;margin-bottom:2px}
    .route{margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb;color:#334155;font-size:13px}

    .place-label{
      background:rgba(255,255,255,.96);
      color:#111827;
      border:1px solid rgba(15,23,42,.25);
      border-radius:999px;
      padding:3px 8px;
      font-size:12px;
      font-weight:900;
      box-shadow:0 2px 8px rgba(0,0,0,.16);
    }

    .leaflet-interactive{cursor:pointer}

    @media (min-width: 780px){
      .drawer{left:18px;right:auto;bottom:18px;width:410px;max-height:72vh}
      .menu-btn{left:18px;bottom:18px}
      .card{left:auto;right:18px;bottom:18px;width:410px;max-height:58vh}
      .card-body{max-height:calc(58vh - 74px)}
      .hint{left:58px;right:auto;top:16px}
    }

    @media (max-width: 420px){
      .hint{font-size:13px}
      .name{font-size:14px}
      .card-title{font-size:16px}
      .facts{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="map"></div>

<div class="hint" id="hint">
  <b>Izvēlies dienu sarakstā</b> vai pieskaries krāsainai līnijai kartē.
  <button id="hintClose" aria-label="Aizvērt">×</button>
</div>

<button class="menu-btn" id="menuBtn">☰ Dienas</button>

<section class="drawer open" id="drawer" aria-label="Ceļojuma dienu saraksts">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">🇦🇱 Ceļojuma dienas</div>
      <div class="drawer-sub">Izvēlies dienu. Logs aizvērsies, un karte pietuvinās maršrutu.</div>
    </div>
    <button class="close" id="drawerClose" aria-label="Aizvērt">×</button>
  </div>
  <div class="day-list" id="dayList"></div>
</section>

<aside class="card" id="card" aria-live="polite">
  <div class="card-top" id="cardTop">
    <button class="card-close" id="cardClose" aria-label="Aizvērt">×</button>
    <div class="card-date" id="cardDate"></div>
    <div class="card-title" id="cardTitle"></div>
  </div>
  <div class="card-body">
    <div id="cardSummary"></div>
    <div class="facts">
      <div class="fact"><b>Braukšana</b><span id="cardDrive"></span></div>
      <div class="fact"><b>Slodze</b><span id="cardEffort"></span></div>
    </div>
    <div class="route"><b>Maršruts:</b> <span id="cardRoute"></span></div>
  </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const places = {"Viesnīca OAZ / Golema": {"lat": 41.25, "lon": 19.523, "icon": "🏨"}, "Tirānas lidosta": {"lat": 41.4147, "lon": 19.7206, "icon": "✈️"}, "Kruja": {"lat": 41.5095, "lon": 19.792, "icon": "🏰"}, "Rodona rags": {"lat": 41.582, "lon": 19.445, "icon": "🌊"}, "Llogaras pāreja": {"lat": 40.196, "lon": 19.592, "icon": "⛰️"}, "Maja e Qorres zona": {"lat": 40.205, "lon": 19.604, "icon": "🥾"}, "Radhimë / Orikum": {"lat": 40.366, "lon": 19.493, "icon": "🏖️"}, "Vlorë niršanas vieta": {"lat": 40.466, "lon": 19.489, "icon": "🤿"}, "Karaburun-Sazan zona": {"lat": 40.435, "lon": 19.3, "icon": "🐠"}, "Berata": {"lat": 40.7058, "lon": 19.9522, "icon": "🏘️"}, "Bogovë ūdenskritums": {"lat": 40.564, "lon": 20.132, "icon": "💧"}, "Koman ezera piestātne": {"lat": 42.103, "lon": 19.823, "icon": "🚤"}, "Šalas upe": {"lat": 42.185, "lon": 19.779, "icon": "💦"}};
const days = [{"id": "arrival", "date": "03.07. piektdiena", "title": "Ierašanās + Golemas pludmale", "color": "#475569", "dash": "8 8", "weight": 7, "bend": -0.2, "points": ["Tirānas lidosta", "Viesnīca OAZ / Golema"], "summary": "Ielidošana, transfērs uz Golemu, viesnīca un mierīga atpūta pie jūras.", "drive": "Tikai grupas transfērs", "effort": "Viegli", "emoji": "✈️"}, {"id": "kruje", "date": "04.07. sestdiena", "title": "Kruja + Rodona rags", "color": "#ef4444", "dash": "", "weight": 6, "bend": 0.16, "points": ["Viesnīca OAZ / Golema", "Kruja", "Rodona rags", "Viesnīca OAZ / Golema"], "summary": "Krujas vecais tirgus un pils, pēc tam jūras skati un iespējama snorkelēšana Rodona ragā.", "drive": "Vidējs pašbrauciens", "effort": "Viegli / vidēji", "emoji": "🏰"}, {"id": "llogara", "date": "05.07. svētdiena", "title": "Smags pārgājiens: Llogara / Maja e Qorres", "color": "#16a34a", "dash": "", "weight": 6, "bend": -0.12, "points": ["Viesnīca OAZ / Golema", "Llogaras pāreja", "Maja e Qorres zona", "Radhimë / Orikum", "Viesnīca OAZ / Golema"], "summary": "Kalnu pārgājiens ar lieliem skatiem. Pēc tam mierīga pelde pie Radhimë / Orikum.", "drive": "Garš pašbrauciens", "effort": "Smagi", "emoji": "⛰️"}, {"id": "scuba", "date": "06.07. pirmdiena", "title": "Niršana / snorkelēšana: Karaburun-Sazan", "color": "#0284c7", "dash": "", "weight": 6, "bend": 0.1, "points": ["Viesnīca OAZ / Golema", "Vlorë niršanas vieta", "Karaburun-Sazan zona", "Vlorë niršanas vieta", "Viesnīca OAZ / Golema"], "summary": "Iesācēju niršanas diena no Vlorë puses uz Karaburun-Sazan zonu.", "drive": "Vidēji garš pašbrauciens", "effort": "Vidēji", "emoji": "🤿"}, {"id": "berat", "date": "07.07. otrdiena", "title": "Berata + Bogovë ūdenskritums", "color": "#f59e0b", "dash": "", "weight": 6, "bend": 0.13, "points": ["Viesnīca OAZ / Golema", "Berata", "Bogovë ūdenskritums", "Viesnīca OAZ / Golema"], "summary": "Beratas vecpilsēta un pils, pusdienas, pēc tam ūdenskrituma pelde.", "drive": "Vidēji garš pašbrauciens", "effort": "Vidēji", "emoji": "🏘️"}, {"id": "koman", "date": "08.07. trešdiena", "title": "Koman ezers + Šalas upe", "color": "#7c3aed", "dash": "", "weight": 7, "bend": -0.1, "points": ["Viesnīca OAZ / Golema", "Koman ezera piestātne", "Šalas upe", "Koman ezera piestātne", "Viesnīca OAZ / Golema"], "summary": "Organizētā IMPRO ekskursija ar autobusu un laivu uz Koman ezeru un Šalas upi.", "drive": "Organizēta ekskursija, gara diena", "effort": "Vidēji", "emoji": "🚤"}, {"id": "airport", "date": "09.07. ceturtdiena", "title": "Pēdējā pludmale + lidostas transfērs", "color": "#ec4899", "dash": "14 8", "weight": 8, "bend": 0.3, "points": ["Viesnīca OAZ / Golema", "Tirānas lidosta"], "summary": "Mierīga pēdējā diena pie jūras, mantu sakārtošana un vēlais transfērs uz Tirānas lidostu.", "drive": "Tikai grupas transfērs", "effort": "Viegli", "emoji": "✈️"}];

const map = L.map("map", { preferCanvas: true, zoomControl: true }).setView([41.05, 19.65], 8);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const dayLayers = new Map();
const routeBounds = new Map();
const dayButtons = new Map();

const drawer = document.getElementById("drawer");
const menuBtn = document.getElementById("menuBtn");
const card = document.getElementById("card");
const hint = document.getElementById("hint");

function stop(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
}

function latLngOf(name) {
  const p = places[name];
  if (!p) throw new Error("Trūkst koordināšu: " + name);
  return L.latLng(p.lat, p.lon);
}

function curvedSegment(start, end, bend, steps = 36) {
  const lat1 = start.lat, lng1 = start.lng, lat2 = end.lat, lng2 = end.lng;
  const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;
  const dx = lng2 - lng1, dy = lat2 - lat1;
  const distance = Math.sqrt(dx * dx + dy * dy);
  const safeBend = bend * Math.min(distance, 1.4);
  const ctrlLat = midLat - dx * safeBend;
  const ctrlLng = midLng + dy * safeBend;

  const out = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const a = (1 - t) * (1 - t);
    const b = 2 * (1 - t) * t;
    const c = t * t;
    out.push([a * lat1 + b * ctrlLat + c * lat2, a * lng1 + b * ctrlLng + c * lng2]);
  }
  return out;
}

function curvedRoute(points, bend) {
  const route = [];
  for (let i = 0; i < points.length - 1; i++) {
    const segment = curvedSegment(
      latLngOf(points[i]),
      latLngOf(points[i + 1]),
      bend * (i % 2 === 0 ? 1 : -0.75)
    );
    if (i > 0) segment.shift();
    route.push(...segment);
  }
  return route;
}

function allBounds() {
  return L.latLngBounds(days.flatMap(day => day.points.map(name => latLngOf(name))));
}

function setRoutesActive(activeId) {
  dayLayers.forEach((layerObj, id) => {
    const selected = !activeId || id === activeId;
    layerObj.outline.setStyle({ opacity: selected ? 0.96 : 0.25, weight: selected ? layerObj.baseWeight + 5 : layerObj.baseWeight + 2 });
    layerObj.line.setStyle({ opacity: selected ? 0.98 : 0.24, weight: selected ? layerObj.baseWeight : Math.max(3, layerObj.baseWeight - 2) });
  });
  dayButtons.forEach((btn, id) => btn.classList.toggle("active", id === activeId));
}

function hideHint() {
  if (hint) hint.style.display = "none";
}

function openDrawer(e) {
  stop(e);
  hideHint();
  drawer.classList.add("open");
  menuBtn.style.display = "none";
  card.classList.remove("show");
  setTimeout(() => map.invalidateSize(true), 250);
}

function closeDrawer(e) {
  stop(e);
  drawer.classList.remove("open");
  menuBtn.style.display = "block";
  setTimeout(() => map.invalidateSize(true), 250);
}

function closeCard(e) {
  stop(e);
  card.classList.remove("show");
  setRoutesActive(null);
  map.fitBounds(allBounds(), { padding: [45, 45] });
}

function selectDay(dayId, zoom) {
  const day = days.find(d => d.id === dayId);
  if (!day) return;

  hideHint();
  drawer.classList.remove("open");
  menuBtn.style.display = "block";

  setRoutesActive(dayId);

  document.getElementById("cardTop").style.background = day.color;
  document.getElementById("cardDate").textContent = day.date;
  document.getElementById("cardTitle").textContent = `${day.emoji} ${day.title}`;
  document.getElementById("cardSummary").textContent = day.summary;
  document.getElementById("cardDrive").textContent = day.drive;
  document.getElementById("cardEffort").textContent = day.effort;
  document.getElementById("cardRoute").textContent = day.points.join(" → ");
  card.classList.add("show");

  if (zoom) map.fitBounds(routeBounds.get(dayId), { padding: [65, 65], maxZoom: 10 });
}

function addMarkers() {
  Object.entries(places).forEach(([name, p]) => {
    const isBase = name.includes("Golema");
    const isAirport = name.includes("lidosta");

    const marker = L.circleMarker([p.lat, p.lon], {
      radius: isBase ? 9 : isAirport ? 7 : 5,
      color: isBase ? "#111827" : isAirport ? "#ec4899" : "#334155",
      fillColor: isBase ? "#111827" : "#ffffff",
      weight: isBase || isAirport ? 3 : 2,
      fillOpacity: isBase ? 1 : 0.95
    }).addTo(map);

    marker.on("click", () => map.setView([p.lat, p.lon], 10));

    if (isBase) {
      marker.bindTooltip("🏨 Golema — bāze", {
        permanent: true,
        direction: "top",
        offset: [0, -9],
        className: "place-label"
      });
    }
  });
}

function addRoutes() {
  days.forEach(day => {
    const latlngs = curvedRoute(day.points, day.bend);
    routeBounds.set(day.id, L.latLngBounds(day.points.map(name => latLngOf(name))));

    const outline = L.polyline(latlngs, {
      color: "#ffffff",
      weight: day.weight + 5,
      opacity: 0.96,
      lineCap: "round",
      lineJoin: "round",
      interactive: false
    }).addTo(map);

    const line = L.polyline(latlngs, {
      color: day.color,
      weight: day.weight,
      opacity: 0.98,
      dashArray: day.dash || null,
      lineCap: "round",
      lineJoin: "round"
    }).addTo(map);

    line.on("click", () => selectDay(day.id, true));
    line.on("tap", () => selectDay(day.id, true));

    dayLayers.set(day.id, { outline, line, baseWeight: day.weight });
  });
}

function addDayButtons() {
  const list = document.getElementById("dayList");
  days.forEach(day => {
    const btn = document.createElement("button");
    btn.className = "day";
    btn.innerHTML = `
      <span class="stripe" style="background:${day.color}"></span>
      <span>
        <span class="date">${day.date}</span>
        <span class="name">${day.emoji} ${day.title}</span>
      </span>
      <span class="arrow">›</span>
    `;
    btn.addEventListener("click", (e) => {
      stop(e);
      selectDay(day.id, true);
    });
    list.appendChild(btn);
    dayButtons.set(day.id, btn);
  });
}

menuBtn.addEventListener("click", openDrawer);
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
document.getElementById("cardClose").addEventListener("click", closeCard);
document.getElementById("hintClose").addEventListener("click", (e) => { stop(e); hideHint(); });

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    drawer.classList.remove("open");
    card.classList.remove("show");
    menuBtn.style.display = "block";
    setRoutesActive(null);
  }
});

addMarkers();
addRoutes();
addDayButtons();
map.fitBounds(allBounds(), { padding: [45, 45] });

// First load: day menu is open, menu button hidden. After choosing/closing, normal behaviour resumes.
drawer.classList.add("open");
menuBtn.style.display = "none";

setTimeout(() => map.invalidateSize(true), 250);
setTimeout(() => map.invalidateSize(true), 1000);
setTimeout(() => {
  if (hint) hint.style.display = "none";
}, 8500);

console.log("Albānijas karte OK", {dienas: days.length, vietas: Object.keys(places).length});
</script>
</body>
</html>
