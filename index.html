<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <title>Albānijas ceļojuma karte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    .leaflet-container{overflow:hidden;position:relative;outline-style:none;background:#ddd;font:12px/1.5 Arial,sans-serif}
    .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
    .leaflet-map-pane,.leaflet-marker-pane,.leaflet-shadow-pane,.leaflet-tile-pane,.leaflet-overlay-pane,.leaflet-popup-pane,.leaflet-tooltip-pane{position:absolute;left:0;top:0}
    .leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}
    .leaflet-tile-loaded{visibility:inherit}
    .leaflet-tile-pane{z-index:200} .leaflet-overlay-pane{z-index:400} .leaflet-shadow-pane{z-index:500} .leaflet-marker-pane{z-index:600} .leaflet-tooltip-pane{z-index:650} .leaflet-popup-pane{z-index:700}
    .leaflet-control{position:relative;z-index:800;pointer-events:auto} .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none} .leaflet-top{top:0} .leaflet-right{right:0} .leaflet-bottom{bottom:0} .leaflet-left{left:0}
    .leaflet-control-zoom{margin-left:12px;margin-top:12px;border:2px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;overflow:hidden}
    .leaflet-control-zoom a{display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;color:#000;background:#fff;border-bottom:1px solid #ccc;font:bold 20px Arial}
    .leaflet-control-zoom a:last-child{border-bottom:none}
    .leaflet-tooltip{position:absolute;padding:6px;background:#fff;border:1px solid #fff;border-radius:4px;color:#222;white-space:nowrap;user-select:none;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.35)}

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body,#map{height:100%;height:100dvh;width:100%;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7}
    #map{z-index:1}

    :root{
      --dark:rgba(17,24,39,.95);
      --soft:rgba(255,255,255,.16);
      --shadow:0 12px 32px rgba(0,0,0,.28);
      --accent:#111827;
    }

    .menu-btn,.checklist-btn{
      position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1400;
      border:0;border-radius:999px;background:var(--dark);color:white;box-shadow:var(--shadow);
      padding:12px 16px;font-weight:800;font-size:15px;min-height:48px;cursor:pointer;display:none;
    }
    .menu-btn{left:14px}
    .checklist-btn{right:14px}

    .hint{
      position:fixed;left:14px;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:1350;
      background:rgba(255,255,255,.96);color:#111827;border-radius:14px;padding:10px 42px 10px 12px;
      box-shadow:var(--shadow);font-size:14px;line-height:1.3;max-width:620px;
    }
    .hint button{position:absolute;right:6px;top:6px;border:0;background:#e5e7eb;border-radius:999px;width:30px;height:30px;font-size:20px;line-height:1;cursor:pointer}

    .drawer{
      position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:1500;
      background:var(--dark);color:white;border-radius:18px;box-shadow:var(--shadow);max-height:min(78dvh,680px);
      transform:translateY(calc(100% + 24px));transition:transform .22s ease;overflow:hidden;display:flex;flex-direction:column;
    }
    .drawer.open{transform:translateY(0)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--soft)}
    .drawer-title{font-weight:900;font-size:17px}
    .drawer-sub{color:#cbd5e1;font-size:13px;margin-top:3px;line-height:1.3}
    .close{border:0;background:rgba(255,255,255,.16);color:white;width:38px;height:38px;border-radius:999px;font-size:24px;line-height:1;cursor:pointer;flex:0 0 auto}

    .day-list{overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
    .day{
      width:100%;display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;color:white;
      background:rgba(255,255,255,.07);border:1px solid var(--soft);border-radius:14px;padding:10px;margin-bottom:8px;text-align:left;cursor:pointer;min-height:56px;
    }
    .day.active{background:rgba(255,255,255,.20);border-color:rgba(255,255,255,.65)}
    .stripe{width:10px;height:40px;border-radius:999px}
    .date{display:block;font-size:12px;color:#cbd5e1;font-weight:800;margin-bottom:2px}
    .name{display:block;font-size:15px;font-weight:900;line-height:1.2}
    .arrow{font-size:22px;color:#cbd5e1;font-weight:900}

    .card{
      position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:1450;
      background:white;color:#111827;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:74dvh;
    }
    .card.show{display:block}
    .card-top{color:white;padding:12px 52px 12px 14px;position:relative}
    .card-date{font-size:13px;font-weight:900;opacity:.93;margin-bottom:2px}
    .card-title{font-size:18px;font-weight:900;line-height:1.2}
    .card-close{position:absolute;right:8px;top:8px;border:0;background:rgba(255,255,255,.24);color:white;width:38px;height:38px;border-radius:999px;font-size:24px;line-height:1;cursor:pointer}
    .card-body{padding:12px 14px 14px;font-size:14px;line-height:1.35;overflow:auto;max-height:calc(74dvh - 70px)}
    .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
    .fact{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:8px 10px;font-size:13px}
    .fact b{display:block;color:#64748b;text-transform:uppercase;font-size:11px;margin-bottom:2px}
    .route{margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb;color:#334155;font-size:13px}

    .schedule-toggle,.reset-checks{
      width:100%;border:0;border-radius:12px;background:#111827;color:white;font-weight:900;
      padding:11px 12px;margin-top:12px;cursor:pointer;font-size:14px;
    }
    .timeline{display:none;margin-top:12px;border-top:1px solid #e5e7eb;padding-top:4px}
    .timeline.open{display:block}
    .slot{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #edf2f7}
    .slot:last-child{border-bottom:0}
    .slot-time{font-weight:900;color:#111827;font-size:13px;line-height:1.25}
    .slot-main{min-width:0}
    .slot-title{font-weight:900;margin-bottom:2px}
    .slot-place{color:#475569;font-size:13px;margin-bottom:3px}
    .slot-note{color:#334155;font-size:13px}

    .check-panel{
      position:fixed;inset:10px;z-index:1700;background:white;color:#111827;border-radius:18px;
      box-shadow:var(--shadow);display:none;overflow:hidden;flex-direction:column;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .check-panel.open{display:flex}
    .check-head{
      background:#111827;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;
    }
    .check-title{font-weight:900;font-size:18px}
    .check-sub{font-size:13px;color:#cbd5e1;margin-top:3px;line-height:1.3}
    .check-body{overflow:auto;padding:12px 14px 18px;-webkit-overflow-scrolling:touch}
    .progress-wrap{background:#e5e7eb;border-radius:999px;height:12px;overflow:hidden;margin:4px 0 10px}
    .progress-bar{height:100%;width:0%;background:#16a34a;transition:width .18s ease}
    .progress-text{font-size:13px;color:#475569;margin-bottom:12px;font-weight:800}
    .check-section{margin:0 0 16px}
    .check-section h3{font-size:15px;margin:0 0 8px;padding:9px 10px;background:#f1f5f9;border-radius:12px}
    .check-row{
      display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;
      padding:10px 4px;border-bottom:1px solid #edf2f7;font-size:14px;line-height:1.28;
    }
    .check-row input{width:22px;height:22px;margin:0;accent-color:#16a34a}
    .check-row.done span{text-decoration:line-through;color:#64748b}
    .reset-checks{background:#b91c1c;margin-bottom:10px}

    .hotel-label{
      background:rgba(17,24,39,.92);color:white;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:900;
      box-shadow:0 2px 10px rgba(0,0,0,.28);white-space:nowrap;pointer-events:auto;
    }
    .leaflet-interactive{cursor:pointer}
    .tap-line{cursor:pointer;stroke-linecap:round;stroke-linejoin:round}

    @media (min-width:780px){
      .drawer{left:18px;right:auto;bottom:18px;width:410px;max-height:72vh}
      .menu-btn{left:18px;bottom:18px}
      .checklist-btn{right:auto;left:146px;bottom:18px}
      .card{left:auto;right:18px;bottom:18px;width:460px;max-height:84vh}
      .card-body{max-height:calc(84vh - 74px)}
      .hint{left:58px;right:auto;top:16px}
      .check-panel{inset:24px;max-width:720px;margin:auto;max-height:90vh}
    }
    @media (max-width:420px){
      .hint{font-size:13px}
      .name{font-size:14px}
      .card-title{font-size:16px}
      .facts{grid-template-columns:1fr}
      .slot{grid-template-columns:76px 1fr;gap:8px}
      .menu-btn,.checklist-btn{font-size:14px;padding:11px 14px}
    }
  </style>
</head>
<body>
<div id="map"></div>

<div class="hint" id="hint">
  <b>Izvēlies dienu sarakstā</b> vai atver <b>Checklist</b>. Atzīmes saglabājas šajā telefonā/pārlūkā.
  <button id="hintClose" aria-label="Aizvērt">×</button>
</div>

<button class="menu-btn" id="menuBtn">☰ Dienas</button>
<button class="checklist-btn" id="checklistBtn">☑ Checklist</button>

<section class="drawer open" id="drawer" aria-label="Ceļojuma dienu saraksts">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">🇦🇱 Ceļojuma dienas</div>
      <div class="drawer-sub">Izvēlies dienu. Logs aizvērsies, karte pietuvinās maršrutu.</div>
    </div>
    <button class="close" id="drawerClose" aria-label="Aizvērt">×</button>
  </div>
  <div class="day-list" id="dayList"></div>
</section>

<aside class="card" id="card" aria-live="polite">
  <div class="card-top" id="cardTop">
    <button class="card-close" id="cardClose" aria-label="Aizvērt">×</button>
    <div class="card-date" id="cardDate"></div>
    <div class="card-title" id="cardTitle"></div>
  </div>
  <div class="card-body" id="cardBody">
    <div id="cardSummary"></div>
    <div class="facts">
      <div class="fact"><b>Braukšana</b><span id="cardDrive"></span></div>
      <div class="fact"><b>Slodze</b><span id="cardEffort"></span></div>
    </div>
    <div class="route"><b>Maršruts:</b> <span id="cardRoute"></span></div>
    <button class="schedule-toggle" id="scheduleToggle">Rādīt pilno laika plānu</button>
    <div class="timeline" id="timeline"></div>
  </div>
</aside>

<section class="check-panel" id="checkPanel" aria-label="Ceļojuma checklist">
  <div class="check-head">
    <div>
      <div class="check-title">☑ Ceļojuma checklist</div>
      <div class="check-sub">Saglabājas tikai šajā ierīcē un pārlūkā. Nesinhronizējas ar citiem.</div>
    </div>
    <button class="close" id="checkClose" aria-label="Aizvērt">×</button>
  </div>
  <div class="check-body">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 0 gatavs</div>
    <div id="checkContent"></div>
    <button class="reset-checks" id="resetChecks">Notīrīt visas atzīmes šajā telefonā</button>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

function stop(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
}

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}

function latLngOf(name) {
  const p = places[name];
  if (!p) throw new Error("Trūkst koordināšu: " + name);
  return L.latLng(p.lat, p.lon);
}

function curvedSegment(start, end, bend, steps = 36) {
  const lat1 = start.lat, lng1 = start.lng, lat2 = end.lat, lng2 = end.lng;
  const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;
  const dx = lng2 - lng1, dy = lat2 - lat1;
  const distance = Math.sqrt(dx * dx + dy * dy);
  const safeBend = bend * Math.min(distance, 1.4);
  const ctrlLat = midLat - dx * safeBend;
  const ctrlLng = midLng + dy * safeBend;
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const a = (1 - t) * (1 - t);
    const b = 2 * (1 - t) * t;
    const c = t * t;
    out.push([a * lat1 + b * ctrlLat + c * lat2, a * lng1 + b * ctrlLng + c * lng2]);
  }
  return out;
}

function curvedRoute(points, bend) {
  const route = [];
  for (let i = 0; i < points.length - 1; i++) {
    const segment = curvedSegment(
      latLngOf(points[i]),
      latLngOf(points[i + 1]),
      bend * (i % 2 === 0 ? 1 : -0.75)
    );
    if (i > 0) segment.shift();
    route.push(...segment);
  }
  return route;
}

function allBounds() {
  return L.latLngBounds(days.flatMap(day => day.points.map(name => latLngOf(name))));
}

function setRoutesActive(activeId) {
  dayLayers.forEach((layerObj, id) => {
    const selected = !activeId || id === activeId;
    layerObj.outline.setStyle({ opacity: selected ? 0.96 : 0.24, weight: selected ? layerObj.baseWeight + 5 : layerObj.baseWeight + 2 });
    layerObj.line.setStyle({ opacity: selected ? 0.98 : 0.26, weight: selected ? layerObj.baseWeight : Math.max(3, layerObj.baseWeight - 2) });
    layerObj.hit.setStyle({ weight: selected ? 46 : 34 });
  });
  dayButtons.forEach((btn, id) => btn.classList.toggle("active", id === activeId));
}

function hideHint() {
  if (hint) hint.style.display = "none";
}

function openDrawer(e) {
  stop(e);
  hideHint();
  checkPanel.classList.remove("open");
  drawer.classList.add("open");
  menuBtn.style.display = "none";
  checklistBtn.style.display = "none";
  card.classList.remove("show");
  setTimeout(() => map.invalidateSize(true), 250);
}

function closeDrawer(e) {
  stop(e);
  drawer.classList.remove("open");
  menuBtn.style.display = "block";
  checklistBtn.style.display = "block";
  setTimeout(() => map.invalidateSize(true), 250);
}

function closeCard(e) {
  stop(e);
  card.classList.remove("show");
  selectedDayId = null;
  setRoutesActive(null);
  timeline.classList.remove("open");
  scheduleToggle.textContent = "Rādīt pilno laika plānu";
  map.fitBounds(allBounds(), { padding: [45, 45] });
}

function renderTimeline(day) {
  timeline.innerHTML = day.schedule.map(item => `
    <div class="slot">
      <div class="slot-time">${escapeHtml(item.time)}</div>
      <div class="slot-main">
        <div class="slot-title">${escapeHtml(item.title)}</div>
        <div class="slot-place">${escapeHtml(item.place)}</div>
        <div class="slot-note">${escapeHtml(item.note)}</div>
      </div>
    </div>
  `).join("");
  timeline.classList.remove("open");
  scheduleToggle.textContent = "Rādīt pilno laika plānu";
  cardBody.scrollTop = 0;
}

function toggleSchedule(e) {
  stop(e);
  const open = timeline.classList.toggle("open");
  scheduleToggle.textContent = open ? "Paslēpt laika plānu" : "Rādīt pilno laika plānu";
  if (open) setTimeout(() => scheduleToggle.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
}

function selectDay(dayId, zoom) {
  const day = days.find(d => d.id === dayId);
  if (!day) return;

  selectedDayId = dayId;
  hideHint();
  checkPanel.classList.remove("open");
  drawer.classList.remove("open");
  menuBtn.style.display = "block";
  checklistBtn.style.display = "block";
  setRoutesActive(dayId);

  document.getElementById("cardTop").style.background = day.color;
  document.getElementById("cardDate").textContent = day.date;
  document.getElementById("cardTitle").textContent = `${day.emoji} ${day.title}`;
  document.getElementById("cardSummary").textContent = day.summary;
  document.getElementById("cardDrive").textContent = day.drive;
  document.getElementById("cardEffort").textContent = day.effort;
  document.getElementById("cardRoute").textContent = day.points.join(" → ");
  renderTimeline(day);
  card.classList.add("show");

  if (zoom) map.fitBounds(routeBounds.get(dayId), { padding: [65, 65], maxZoom: 10 });
}

  L.marker([41.2585, 19.4900], {
    icon: L.divIcon({ className: "hotel-label", html: "🏨 Golema — viesnīca", iconSize: null })
  }).addTo(map).on("click", () => map.setView([hotel.lat, hotel.lon], 12));

  Object.entries(places).forEach(([name, p]) => {
    if (name === "Viesnīca OAZ / Golema") return;
    const isAirport = name.includes("lidosta");
    L.circleMarker([p.lat, p.lon], {
      radius: isAirport ? 7 : 5,
      color: isAirport ? "#ec4899" : "#334155",
      fillColor: "#ffffff",
      weight: isAirport ? 3 : 2,
      fillOpacity: 0.95
    }).addTo(map).on("click", () => map.setView([p.lat, p.lon], 10));
  });
}

function addRoutes() {
  days.forEach(day => {
    const latlngs = curvedRoute(day.points, day.bend);
    routeBounds.set(day.id, L.latLngBounds(day.points.map(name => latLngOf(name))));

    const outline = L.polyline(latlngs, {
      color: "#ffffff", weight: day.weight + 5, opacity: 0.96,
      lineCap: "round", lineJoin: "round", interactive: false
    }).addTo(map);

    const line = L.polyline(latlngs, {
      color: day.color, weight: day.weight, opacity: 0.98,
      dashArray: day.dash || null, lineCap: "round", lineJoin: "round", interactive: false
    }).addTo(map);

    const hit = L.polyline(latlngs, {
      color: day.color, weight: 42, opacity: 0.001,
      lineCap: "round", lineJoin: "round", className: "tap-line"
    }).addTo(map);

    hit.on("click", () => selectDay(day.id, true));
    hit.on("touchstart", () => selectDay(day.id, true));
    hit.on("pointerup", () => selectDay(day.id, true));

    dayLayers.set(day.id, { outline, line, hit, baseWeight: day.weight });
  });
}

function addDayButtons() {
  const list = document.getElementById("dayList");
  days.forEach(day => {
    const btn = document.createElement("button");
    btn.className = "day";
    btn.innerHTML = `
      <span class="stripe" style="background:${day.color}"></span>
      <span>
        <span class="date">${escapeHtml(day.date)}</span>
        <span class="name">${day.emoji} ${escapeHtml(day.title)}</span>
      </span>
      <span class="arrow">›</span>
    `;
    btn.addEventListener("click", (e) => {
      stop(e);
      selectDay(day.id, true);
    });
    list.appendChild(btn);
    dayButtons.set(day.id, btn);
  });
}

function loadChecks() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  } catch {
    return {};
  }
}

function saveChecks(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function updateProgress() {
  const boxes = [...document.querySelectorAll(".check-row input")];
  const checked = boxes.filter(b => b.checked).length;
  const total = boxes.length;
  const percent = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById("progressBar").style.width = percent + "%";
  document.getElementById("progressText").textContent = `${checked} / ${total} gatavs (${percent}%)`;
  boxes.forEach(box => box.closest(".check-row").classList.toggle("done", box.checked));
}

function renderChecklist() {
  const state = loadChecks();
  const content = document.getElementById("checkContent");
  let index = 0;
  content.innerHTML = checklists.map(section => {
    const rows = section.items.map(item => {
      const id = "c" + index++;
      const checked = state[id] ? "checked" : "";
      return `
        <label class="check-row">
          <input type="checkbox" data-check-id="${id}" ${checked}>
          <span>${escapeHtml(item)}</span>
        </label>
      `;
    }).join("");
    return `<section class="check-section"><h3>${escapeHtml(section.title)}</h3>${rows}</section>`;
  }).join("");

  content.querySelectorAll("input[type='checkbox']").forEach(box => {
    box.addEventListener("change", () => {
      const s = loadChecks();
      s[box.dataset.checkId] = box.checked;
      saveChecks(s);
      updateProgress();
    });
  });
  updateProgress();
}

function openChecklist(e) {
  stop(e);
  hideHint();
  drawer.classList.remove("open");
  card.classList.remove("show");
  checkPanel.classList.add("open");
  menuBtn.style.display = "none";
  checklistBtn.style.display = "none";
  renderChecklist();
}

function closeChecklist(e) {
  stop(e);
  checkPanel.classList.remove("open");
  menuBtn.style.display = "block";
  checklistBtn.style.display = "block";
}

function resetChecks(e) {
  stop(e);
  const ok = confirm("Notīrīt visas checklist atzīmes šajā telefonā?");
  if (!ok) return;
  localStorage.removeItem(STORAGE_KEY);
  renderChecklist();
}

menuBtn.addEventListener("click", openDrawer);
checklistBtn.addEventListener("click", openChecklist);
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
document.getElementById("cardClose").addEventListener("click", closeCard);
document.getElementById("hintClose").addEventListener("click", (e) => { stop(e); hideHint(); });
document.getElementById("checkClose").addEventListener("click", closeChecklist);
document.getElementById("resetChecks").addEventListener("click", resetChecks);
scheduleToggle.addEventListener("click", toggleSchedule);

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    drawer.classList.remove("open");
    card.classList.remove("show");
    checkPanel.classList.remove("open");
    menuBtn.style.display = "block";
    checklistBtn.style.display = "block";
    selectedDayId = null;
    setRoutesActive(null);
  }
});

addMarkers();
addRoutes();
addDayButtons();
renderChecklist();
map.fitBounds(allBounds(), { padding: [45, 45] });

drawer.classList.add("open");
menuBtn.style.display = "none";
checklistBtn.style.display = "none";

setTimeout(() => map.invalidateSize(true), 250);
setTimeout(() => map.invalidateSize(true), 1000);
setTimeout(() => { if (hint) hint.style.display = "none"; }, 8500);

console.log("Albānijas karte OK", {
  dienas: days.length,
  vietas: Object.keys(places).length,
  laikaPlanaIeraksti: days.reduce((sum, d) => sum + d.schedule.length, 0),
  checklistItems: checklists.reduce((sum, s) => sum + s.items.length, 0),
  savesLocally: true
});
</script>
</body>
